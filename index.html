<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmos Atlas</title>
</head>
<body>
<div id="gl"></div>
<div id="labels"></div>
<div id="top" class="panel">
  <div class="r"><b>Cosmos Atlas</b><span id="crumbs"></span></div>
  <div class="r" id="tabs"></div>
</div>
<div id="search" class="panel"><input id="q" placeholder="Search this view…  (stars, satellites, planets…)" autocomplete="off"><div id="results"></div></div>
<div id="side" class="panel"><div id="layers"></div><div><h4>Objects</h4><div id="list"></div></div></div>
<div id="info" class="panel"><h2 id="iT"></h2><div class="sub" id="iS"></div><p id="iP"></p><dl id="rows"></dl><button id="act"></button><button id="enter">Enter ›</button></div>
<div id="ctl" class="panel">
  <div><div class="top"><span>Time speed</span><span id="rateTxt"></span></div><input id="speed" type="range" min="0" max="100" value="30"></div>
  <div class="row"><button id="pause">Pause</button><button id="live">Live</button>
    <label><input type="checkbox" id="tLab" checked> Labels</label><label><input type="checkbox" id="tAuto" checked> Auto-orbit</label></div>
  <select id="jump" aria-label="Jump to a moment in time"></select>
  <div class="top"><span id="dateLbl">Date</span><span id="dateTxt"></span></div>
</div>
<div id="tip"></div><div id="toast"></div><div id="fade"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
