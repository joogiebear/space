<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmos Atlas</title>
<style>
:root{--bg:#02030a;--panel:rgba(10,14,30,.74);--line:rgba(150,175,255,.18);--tx:#e2e8ff;--dim:#8e9bc6;--acc:#86a8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
#gl,#gl canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag canvas{cursor:grabbing}#gl.hover canvas{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12.5px;color:rgba(215,225,255,.85);text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000;will-change:transform}
.lb.sel,.lb.hov{color:#fff;font-weight:600}.lb.dim{color:rgba(170,185,230,.7);font-size:11.5px}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#top{top:14px;left:14px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 28px)}
#top .r{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#top b{letter-spacing:.14em;font-size:11px;color:var(--dim);margin-right:6px;text-transform:uppercase}
.crumb,.tab{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:2px 6px;border-radius:6px}
.crumb:hover,.tab:hover{background:rgba(134,168,255,.15)}
.crumb.cur{color:var(--tx);cursor:default}.crumb.cur:hover{background:none}
.tab{border:1px solid var(--line);color:var(--dim);font-size:12.5px}.tab.on{color:#07102a;background:var(--acc);border-color:var(--acc);font-weight:600}
.sep{color:var(--dim)}
#search{top:14px;right:14px;width:250px;padding:6px}
#search input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 10px;font:inherit;outline:none;user-select:text}
#search input:focus{border-color:var(--acc)}
#results{display:none;max-height:44vh;overflow:auto;margin-top:6px}
#results.open{display:block}
#results button,#list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:inherit;padding:5px 8px;border-radius:7px;cursor:pointer}
#results button:hover,#list button:hover{background:rgba(134,168,255,.14)}
#results small{color:var(--dim);margin-left:6px}
#side{top:68px;right:14px;width:250px;max-height:calc(100% - 330px);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#side h4{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
#side label{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:13px;cursor:pointer;padding:1px 2px}
#side label i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#side label span{margin-left:auto;color:var(--dim);font-size:12px}
#list button.sel{background:rgba(134,168,255,.28)}#list button.sub{padding-left:22px;color:var(--dim);font-size:13px}
#list{max-height:200px;overflow:auto}
#info{left:14px;bottom:14px;width:min(400px,calc(100% - 28px));padding:14px 16px;max-height:55vh;overflow:auto}
#info h2{margin:0 0 2px;font-size:19px;font-weight:600}
#info .sub{color:var(--acc);font-size:12.5px;margin-bottom:6px}
#info p{margin:0;color:#c3ccee;font-size:13.5px}
#rows{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:8px;font-size:12.5px}
#rows dt{color:var(--dim)}#rows dd{margin:0;color:var(--tx)}
#enter{margin-top:10px;background:var(--acc);color:#07102a;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer;display:none}
#ctl{right:14px;bottom:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;width:270px}
#ctl label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;cursor:pointer}
#ctl .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#ctl input[type=range]{width:100%;accent-color:var(--acc)}
#ctl .top{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
#ctl .top span:last-child{color:var(--tx)}
#ctl button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:3px 10px;font:inherit;cursor:pointer}
#ctl button:hover{border-color:var(--acc)}
#tip{position:fixed;pointer-events:none;background:rgba(5,8,20,.92);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 22px;display:none;text-align:center;backdrop-filter:blur(10px)}
#toast small{display:block;color:var(--dim);margin-top:2px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
@media(max-width:820px){#search{width:calc(100% - 28px);top:auto;bottom:auto;left:14px;right:14px;top:104px}#side{top:160px;right:14px;max-height:30vh}#ctl{width:auto;left:14px;right:14px;bottom:auto;top:auto;display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
</head>
<body>
<div id="gl"></div>
<div id="labels"></div>
<div id="top" class="panel">
  <div class="r"><b>Cosmos Atlas</b><span id="crumbs"></span></div>
  <div class="r" id="tabs"></div>
</div>
<div id="search" class="panel"><input id="q" placeholder="Search this view…  (stars, satellites, planets…)" autocomplete="off"><div id="results"></div></div>
<div id="side" class="panel"><div id="layers"></div><div><h4>Objects</h4><div id="list"></div></div></div>
<div id="info" class="panel"><h2 id="iT"></h2><div class="sub" id="iS"></div><p id="iP"></p><dl id="rows"></dl><button id="enter">Enter ›</button></div>
<div id="ctl" class="panel">
  <div><div class="top"><span>Time speed</span><span id="rateTxt"></span></div><input id="speed" type="range" min="0" max="100" value="30"></div>
  <div class="row"><button id="pause">Pause</button><button id="live">Live</button>
    <label><input type="checkbox" id="tLab" checked> Labels</label><label><input type="checkbox" id="tAuto" checked> Auto-orbit</label></div>
  <div class="top"><span id="dateLbl">Date</span><span id="dateTxt"></span></div>
</div>
<div id="tip"></div><div id="toast"></div><div id="fade"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
