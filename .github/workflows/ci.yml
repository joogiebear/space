name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Type-check (vue-tsc, strict)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Keep the build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  server:
    name: Python server imports cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile every module
        run: python -m compileall -q server
      - name: Import the app (catches missing names between modules)
        run: python -c "import server.app; print('routes:', sorted(server.app.API))"
      - name: Python unit tests
        run: python -m unittest discover -s server -p "test_*.py" -t .

  e2e:
    name: Browser smoke test (desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
